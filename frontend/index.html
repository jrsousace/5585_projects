<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Financeiro - Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>FinanceApp</h2>
      </div>
      <nav class="sidebar-nav" id="main-nav">
        <!-- Navegação injetada dinamicamente pelo JS (Fase 3) -->
      </nav>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-outline" style="width: 100%;">Sair</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <button id="btn-menu-toggle" class="menu-toggle">☰</button>
        <div class="user-info">
          <span id="user-name">Carregando...</span>
        </div>
      </header>

      <!-- Container raiz onde os templates serão renderizados (Fase 2) -->
      <div id="app" class="content-area"></div>
    </main>
  </div>

  <!-- Fase 4 e Fase 3: Templates HTML escondidos -->
  
  <!-- Template: Dashboard (Home) -->
  <template id="tpl-dashboard">
    <div class="view-header">
      <h1>Dashboard</h1>
      <p>Bem-vindo ao seu painel financeiro.</p>
    </div>
    <div class="dashboard-cards">
      <div class="card">
        <h3>Saldo Atual</h3>
        <p class="h2">R$ <span id="dash-saldo">0,00</span></p>
      </div>
      <div class="card">
        <h3>Despesas (Mês)</h3>
        <p class="h2" style="color: var(--error-color);">R$ <span id="dash-despesas">0,00</span></p>
      </div>
    </div>
    
    <div class="card mt-4">
      <h3>Resumo de Despesas</h3>
      <div class="chart-container" style="position: relative; height:300px; width:100%">
        <canvas id="expensesChart"></canvas>
      </div>
    </div>
  </template>

  <!-- Template: Orçamento Doméstico -->
  <template id="tpl-orcamento">
    <div class="view-header">
      <h1>Orçamento Doméstico</h1>
      <button class="btn" data-action="nova-transacao">Nova Transação</button>
    </div>
    
    <div class="card mt-4">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Forma PG</th>
              <th>Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes">
            <!-- Renderizado via JS DocumentFragment -->
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Modal Global (Injetado via JS quando necessário) -->
  <div id="modal-backdrop" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Nova Transação</h2>
        <button class="btn-close" id="btn-close-modal">×</button>
      </div>
      <div class="modal-body" id="modal-body-content">
        <!-- O formulário será injetado aqui -->
      </div>
    </div>
  </div>

  <!-- Formulário de Transação (Escondido) -->
  <template id="tpl-form-transacao">
    <form id="form-transacao">
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select id="t-tipo" required>
          <option value="despesa">Despesa</option>
          <option value="receita">Receita</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <input type="text" id="t-descricao" required placeholder="Ex: Supermercado">
      </div>
      <div class="form-group">
        <label class="form-label">Valor (R$)</label>
        <input type="number" id="t-valor" step="0.01" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Data</label>
        <input type="date" id="t-data" required>
      </div>
      <button type="submit" class="btn">Salvar Transação</button>
    </form>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modules/budget.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
