<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SaaS Financeiro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16845B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-md);
      background-color: var(--bg-color);
    }
    .login-card {
      background: var(--surface-color);
      padding: var(--spacing-xl);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }
    .error-message {
      color: var(--error-color);
      font-size: 0.875rem;
      margin-top: var(--spacing-xs);
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Bem-vindo</h1>
        <p class="text-muted">Faça login na sua conta</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" name="email" required placeholder="seu@email.com">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
          <div id="login-error" class="error-message">Credenciais inválidas.</div>
        </div>
        
        <button type="submit" class="btn mt-4">Entrar</button>
        <button type="button" class="btn btn-outline mt-4" style="margin-top: 10px;" id="btn-show-register">Criar Conta</button>
      </form>

      <!-- Formulário de Registro (Inicia Escondido) -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Nome Completo</label>
          <input type="text" id="reg-name" required placeholder="Seu Nome">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-email">E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-password">Senha</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
          <div id="register-error" class="error-message">Erro ao criar conta.</div>
          <div id="register-success" class="error-message" style="color: var(--success-color);">Conta criada com sucesso! Faça login.</div>
        </div>
        
        <button type="submit" class="btn mt-4">Registrar</button>
        <button type="button" class="btn btn-outline mt-4" style="margin-top: 10px;" id="btn-show-login">Já tenho conta</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
